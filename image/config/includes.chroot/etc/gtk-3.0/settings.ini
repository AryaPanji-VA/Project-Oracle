# ============================================================================
# ORACLE-OS — GTK3 system defaults
# Target: GTK 3.24 (Debian 13 Trixie)
# Stage 3C.
#
# Kenapa file ini ada padahal xsettings.xml juga mengatur hal sama:
# channel xsettings XFCE hanya menjangkau aplikasi yang terhubung ke
# xfsettingsd. Aplikasi GTK3 yang dijalankan di luar sesi XFCE (greeter,
# atau proses yang start sebelum xfsettingsd) membaca /etc/gtk-3.0/settings.ini.
# Kedua lapisan harus sepakat; nilai di sini identik dengan xsettings.xml.
#
# Nama tema diverifikasi terhadap direktori nyata di image:
#   gtk-theme-name      ORACLE          -> /usr/share/themes/ORACLE/
#   gtk-icon-theme-name ORACLE-Papirus  -> /usr/share/icons/ORACLE-Papirus/
#   gtk-cursor-theme-name DMZ-Black     -> /usr/share/icons/DMZ-Black/
# "dmz-cursor-theme" adalah nama PAKET, bukan nama theme.
# ============================================================================

[Settings]
gtk-theme-name=ORACLE
gtk-icon-theme-name=ORACLE-Papirus
gtk-font-name=Inter 11
gtk-cursor-theme-name=DMZ-Black
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=false
