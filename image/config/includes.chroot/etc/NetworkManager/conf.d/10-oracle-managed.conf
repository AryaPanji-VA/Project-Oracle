# ============================================================================
# ORACLE OS — NetworkManager: ambil alih antarmuka dari ifupdown
#
# MASALAH
# live-build menulis /etc/network/interfaces berisi:
#     allow-hotplug ens3
#     iface ens3 inet dhcp
# NetworkManager secara default memperlakukan setiap antarmuka yang tercantum
# di /etc/network/interfaces sebagai UNMANAGED. Akibatnya NM jalan tapi tidak
# mengelola apa pun: applet panel kosong, "Connection Information" kosong, dan
# mengganti jaringan tidak berpengaruh.
#
# SOLUSI
# `managed=true` membuat NM mengelola antarmuka yang terdaftar di ifupdown.
# Ini cara yang didukung NM sendiri dan tidak perlu menghapus/menulis ulang
# /etc/network/interfaces milik live-build.
#
# KENAPA BUKAN menghapus entri dari /etc/network/interfaces
# Berkas itu dibuat oleh live-config saat runtime, bukan berkas statis yang
# bisa kita timpa dari includes.chroot. Mengubahnya di hook akan hilang pada
# boot berikutnya.
#
# CATATAN
# `networking.service` tetap boleh jalan. Ia hanya mengonfigurasi alamat awal
# lewat DHCP; setelah NM mengambil alih, NM yang memegang kendali. Tidak ada
# dua proses yang menulis konfigurasi yang sama secara bersamaan karena
# ifupdown hanya berjalan sekali di awal boot.
# ============================================================================
[main]
plugins=ifupdown,keyfile

[ifupdown]
managed=true

[device]
wifi.scan-rand-mac-address=no
