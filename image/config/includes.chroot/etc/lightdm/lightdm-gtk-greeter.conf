# ============================================================================
# ORACLE-OS — LightDM GTK Greeter configuration
# Target: lightdm-gtk-greeter 2.0.9-1 (Debian 13 Trixie), GTK 3
# Stage 3C. Diterapkan ke /etc/lightdm/lightdm-gtk-greeter.conf.
#
# Setiap key di bawah sudah diverifikasi ADA di binary 2.0.9 (audit ulang
# Stage 3C: 22/22 key ditemukan). Tidak ada key karangan.
#
# Precedence (dari tinggi ke rendah):
#   /etc/lightdm/lightdm-gtk-greeter.conf          <- file ini (lapisan 1)
#   /etc/lightdm/lightdm-gtk-greeter.conf.d/*.conf
#   /usr/share/lightdm/lightdm-gtk-greeter.conf.d/*.conf
# Karena lapisan 1 menang, 01_debian.conf tidak perlu dihapus.
# ============================================================================

[greeter]
# --- Tema & ikon ------------------------------------------------------------
# theme-name membawa seluruh styling greeter: binary 2.0.9 tidak punya opsi
# CSS eksternal, CSS dikompilasi ke dalam binary. File GTK theme yang dipakai
# adalah /usr/share/themes/ORACLE/gtk-3.0/gtk.css, yang sudah memuat blok
# ORACLE greeter (digabung pada Stage 3C).
theme-name=ORACLE
icon-theme-name=ORACLE-Papirus
# Nama theme kursor sebenarnya adalah DMZ-Black. Nama paketnya
# "dmz-cursor-theme", dan paket itu tidak menyediakan theme dengan nama
# tersebut. Nilai di sini sudah diverifikasi terhadap
# /usr/share/icons/DMZ-Black/index.theme.
cursor-theme-name=DMZ-Black
cursor-theme-size=24

# --- Latar ------------------------------------------------------------------
# Warna solid, bukan gambar: login harus tenang dan tidak bergantung pada
# resolusi wallpaper. Greeter menerima path gambar ATAU warna (#rrggbb).
background=#E9E5DA
# Jangan pakai background per-user: live image tidak punya ~/.face.
user-background=false
transition-type=none

# --- Tipografi --------------------------------------------------------------
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintfull
xft-rgba=rgb

# --- Jendela login ----------------------------------------------------------
position=50% 50%
hide-user-image=false
round-user-image=true
highlight-logged-user=true

# --- Panel ------------------------------------------------------------------
panel-position=top
clock-format=%H:%M
# Indikator yang tersedia di 2.0.9: ~a11y ~language ~session ~power ~clock
# ~host ~spacer ~layout. Hanya yang berguna di live image.
indicators=~host;~clock;~spacer;~session;~power;~a11y

# --- Aksesibilitas ----------------------------------------------------------
# "-name" = mati saat mulai. Live image: jangan aktifkan kontras tinggi
# otomatis, karena akan menimpa palet ORACLE.
a11y-states=-contrast;font;keyboard;reader
reader=orca

# --- Sesi -------------------------------------------------------------------
default-session=xfce

# --- Keamanan ---------------------------------------------------------------
allow-debugging=false
