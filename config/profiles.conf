# ============================================================================
# config/profiles.conf — profile keamanan yang ikut dibangun ke dalam image
#
# Kosongkan (atau komentari semua) untuk image minimal tanpa profile.
# Profile yang tidak dipilih di sini tetap bisa dipasang setelah boot:
#     sudo oracle profile install <nama>
#
# Satu nama per baris. Nama harus cocok dengan file di
# image/config/includes.chroot/usr/share/oracle/profiles/<nama>.list
#
# Contoh:
#   networking
#   web-security
#
# Untuk image v0.1 pertama: biarkan kosong. Image pertama harus boot dulu
# sebelum kita menambah paket.
# ============================================================================

# networking
# web-security
